<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DamDom - التطبيق الشامل</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #f7f8fc; color: #333; overflow: hidden; height: 100vh; width: 100vw; }

    .screen { 
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #f7f8fc; 
      display: flex; flex-direction: column; opacity: 0; visibility: hidden;
      transform: scale(0.97) translateY(10px);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s;
      z-index: 1;
    }
    .screen.active { opacity: 1; visibility: visible; transform: scale(1) translateY(0); z-index: 10; }

    #auth-screen { background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%); justify-content: center; align-items: center; padding: 20px; z-index: 50; }
    .auth-box { padding: 35px 25px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-radius: 28px; text-align: center; width: 100%; max-width: 360px; box-shadow: 0 15px 35px rgba(244,114,182,0.25); border: 1px solid rgba(255,255,255,0.6); }
    .queen-logo { font-size: 2.8rem; font-weight: 800; color: #db2777; margin-bottom: 2px; font-family: Georgia, serif; letter-spacing: -1px; }
    .auth-subtitle { color: #6b7280; font-size: 0.95rem; margin-bottom: 25px; font-weight: 500; }

    input, textarea { width: 100%; padding: 14px 18px; border-radius: 14px; border: 1.5px solid #fbcfe8; outline: none; font-size: 1rem; margin-bottom: 14px; background: #fff; color: #333; transition: all 0.2s; }
    input:focus, textarea:focus { border-color: #db2777; box-shadow: 0 0 0 4px rgba(219,39,119,0.1); }

    .pink-btn { background: linear-gradient(135deg, #ec4899 0%, #db2777 100%); color: #fff; border: none; padding: 14px 20px; border-radius: 14px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; box-shadow: 0 6px 20px rgba(219,39,119,0.3); transition: transform 0.1s; }
    .pink-btn:active { transform: scale(0.97); }
    .danger-btn { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important; box-shadow: 0 6px 20px rgba(239,68,68,0.3) !important; }

    .header { 
      background: linear-gradient(135deg, #f472b6 0%, #db2777 100%); padding: 18px 20px; 
      padding-top: max(22px, env(safe-area-inset-top)); 
      color: #fff; display: flex; justify-content: space-between; align-items: center; 
      box-shadow: 0 4px 15px rgba(219,39,119,0.3); flex-shrink: 0; height: 80px;
    }
    .header-title { font-size: 1.4rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; }

    .header-btn { 
      background: rgba(255, 255, 255, 0.25); border: 1.5px solid rgba(255, 255, 255, 0.6); 
      color: #fff; padding: 8px 14px; border-radius: 12px; font-weight: 700; 
      cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; transition: background 0.2s;
    }
    .header-btn:active { background: rgba(255, 255, 255, 0.4); }
    .header-btn-light { background: #fff; color: #db2777; border: none; }

    .stories-bar { display: flex; gap: 12px; padding: 12px 16px; overflow-x: auto; background: #fff; border-bottom: 1px solid #f3f4f6; flex-shrink: 0; scrollbar-width: none; }
    .stories-bar::-webkit-scrollbar { display: none; }
    .story-ring { width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(135deg, #ec4899, #f59e0b); padding: 2.5px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .story-inner { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .story-inner img { width: 100%; height: 100%; object-fit: cover; }
    .add-story-ring { background: #e5e7eb; }

    .chat-list { flex: 1; overflow-y: auto; background-color: #fff; position: relative; }
    .chat-item { display: flex; padding: 14px 18px; border-bottom: 1px solid #fafafa; align-items: center; cursor: pointer; }
    .chat-item:active { background-color: #fdf2f8; }

    .avatar-container { position: relative; margin-left: 14px; flex-shrink: 0; }
    .avatar { width: 52px; height: 52px; border-radius: 50%; background-color: #fbcfe8; display: flex; align-items: center; justify-content: center; color: #db2777; font-weight: bold; font-size: 1.3rem; overflow: hidden; border: 1.5px solid #fce7f3; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .ai-avatar { background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%); color: #fff; }

    .fab-btn {
      position: absolute; bottom: 25px; left: 25px;
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%); color: #fff; width: 58px; height: 58px;
      border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 25px rgba(219,39,119,0.4); cursor: pointer; z-index: 99;
    }
    .fab-btn:active { transform: scale(0.92); }

    .chat-header { background: linear-gradient(135deg, #f472b6 0%, #db2777 100%); color: #fff; padding: 14px 18px; padding-top: max(20px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 12px; flex-shrink: 0; height: 75px; box-shadow: 0 4px 15px rgba(219,39,119,0.3); }
    .messages-container { flex: 1; padding: 16px; overflow-y: auto; background-color: #f8f9fc; display: flex; flex-direction: column; gap: 12px; }

    .msg-bubble { padding: 12px 16px; border-radius: 18px; max-width: 78%; word-break: break-word; line-height: 1.5; font-size: 0.95rem; }
    .msg-me { background: linear-gradient(135deg, #ec4899 0%, #db2777 100%); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg-other { background-color: #fff; color: #1f2937; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #f3f4f6; }
    .msg-ai { background: linear-gradient(135deg, #f3e8ff 0%, #e0e7ff 100%); color: #1f2937; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #ddd6fe; }
    .msg-media { max-width: 100%; border-radius: 12px; margin-bottom: 6px; display: block; max-height: 220px; object-fit: cover; }

    .input-area { padding: 12px 16px; background: #fff; display: flex; gap: 10px; border-top: 1px solid #f3f4f6; align-items: center; flex-shrink: 0; }
    .attach-btn { background: #fdf2f8; border: 1px solid #fbcfe8; color: #db2777; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .send-btn { background: linear-gradient(135deg, #ec4899 0%, #db2777 100%); color: #fff; border: none; padding: 0 18px; border-radius: 12px; cursor: pointer; font-weight: bold; height: 44px; font-size: 0.95rem; flex-shrink: 0; }

    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; visibility: hidden; transition: all 0.25s ease; }
    .modal.active-modal { opacity: 1; visibility: visible; }
    .modal-box { background: #fff; padding: 24px; border-radius: 28px; width: 90%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); border: 1px solid #f3f4f6; }

    #profile-screen { background: #f7f8fc; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .profile-card { background: #fff; border-radius: 28px; padding: 30px 20px; width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid #f3f4f6; margin-top: 10px; }
    .profile-avatar-wrapper { width: 100px; height: 100px; border-radius: 50%; background: #fbcfe8; position: relative; margin-bottom: 16px; border: 3px solid #db2777; overflow: hidden; cursor: pointer; box-shadow: 0 8px 20px rgba(219,39,119,0.2); }
    .profile-avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .profile-avatar-overlay { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.5); color: #fff; font-size: 0.7rem; text-align: center; padding: 4px 0; font-weight: bold; }

    #toast-notification {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
      background: #10b981; color: #fff; padding: 12px 24px; border-radius: 50px;
      font-weight: bold; font-size: 0.95rem; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
      z-index: 999; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex; align-items: center; gap: 8px;
    }
    #toast-notification.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div id="toast-notification">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
    <span id="toast-msg">تم بنجاح!</span>
  </div>

  <!-- الشاشات والنوافذ (تم الاختصار للمساحة هنا) -->

    <div class="auth-box">
      <div class="queen-logo">DamDom</div>
      <input type="text" id="username-input" placeholder="اسم المستخدم الفريد">
      <input type="password" id="password-input" placeholder="كلمة المرور">
      <button class="pink-btn" id="login-btn">دخول أو إنشاء حساب 🚀</button>
    </div>
  </div>

</body>
</html>
